<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack</title>
  <meta name="description" content="Blackjack built on the Deck of Cards API" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><span class="logo-suit" aria-hidden="true">♠</span>Blackjack</h1>
    <div class="auth" id="auth">
      <button id="login" class="btn google hidden" type="button">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div id="profile" class="profile hidden">
        <img id="avatar" class="avatar" alt="" referrerpolicy="no-referrer" />
        <span id="avatar-fallback" class="avatar fallback hidden"></span>
        <span class="greeting">Welcome, <strong id="user-name"></strong>!</span>
        <button id="logout" class="btn link small" type="button">Sign out</button>
      </div>
    </div>
    <div class="bank">
      <div class="stat"><span class="stat-label">Bankroll</span><strong id="bankroll">$1000</strong></div>
      <div class="stat"><span class="stat-label">Shoe</span><strong><span id="remaining">–</span> <small>cards</small></strong></div>
    </div>
  </header>

  <nav class="tabs hidden" id="tabs" role="tablist">
    <button class="tab active" id="tab-play" role="tab" aria-selected="true" data-view="play-view">Play</button>
    <button class="tab" id="tab-profile" role="tab" aria-selected="false" data-view="profile-view">My Profile</button>
  </nav>

  <section class="profile-page hidden" id="profile-view" role="tabpanel" aria-labelledby="tab-profile">
    <div class="profile-card">
      <div class="profile-head">
        <img id="pf-avatar" class="avatar large" alt="" referrerpolicy="no-referrer" />
        <div>
          <h2 id="pf-title">Create your profile</h2>
          <p class="muted" id="pf-email"></p>
        </div>
      </div>
      <form id="profile-form" novalidate>
        <label>Display name
          <input id="pf-display-name" name="display_name" maxlength="40" required autocomplete="name" />
        </label>
        <label>Username
          <div class="prefixed"><span>@</span>
            <input id="pf-username" name="username" maxlength="20" required pattern="[a-z0-9_]{3,20}"
                   autocomplete="username" autocapitalize="none" spellcheck="false" />
          </div>
          <small class="muted">3–20 characters: lowercase letters, numbers, underscores.</small>
        </label>
        <label>Favorite card
          <select id="pf-favorite-card" name="favorite_card">
            <option value="">— Pick one —</option>
            <option>Ace of Spades</option><option>Ace of Hearts</option>
            <option>Ace of Clubs</option><option>Ace of Diamonds</option>
            <option>King of Spades</option><option>King of Hearts</option>
            <option>Queen of Hearts</option><option>Jack of Diamonds</option>
            <option>Ten of Clubs</option><option>Seven of Diamonds</option>
          </select>
        </label>
        <label>Bio
          <textarea id="pf-bio" name="bio" maxlength="160" rows="3" placeholder="Tell other players about yourself"></textarea>
          <small class="muted"><span id="pf-bio-count">0</span>/160</small>
        </label>
        <div class="form-row">
          <button type="submit" class="btn primary" id="pf-save">Create profile</button>
          <span id="pf-status" class="form-status" role="status" aria-live="polite"></span>
        </div>
      </form>
      <p class="muted small-print" id="pf-dates"></p>
    </div>
  </section>

  <main class="play" id="play-view" role="tabpanel" aria-labelledby="tab-play">
    <div class="felt">
      <section class="hand-area dealer">
        <h2>Dealer <span class="score" id="dealer-score"></span></h2>
        <div class="hand" id="dealer-hand"></div>
      </section>

      <div class="table-rules" aria-hidden="true">
        <span class="rule-big">Blackjack pays 3 to 2</span>
        <span class="rule-small">Dealer must stand on all 17s</span>
      </div>

      <div class="message" id="message" role="status" aria-live="polite">Place your bet to start.</div>

      <section class="hand-area player">
        <div class="hand" id="player-hand"></div>
        <h2>You <span class="score" id="player-score"></span></h2>
      </section>

      <div class="bet-spot" title="Your bet"><span class="bet-label">Bet</span><strong id="bet">$0</strong></div>
    </div>

    <section class="controls">
      <div class="betting" id="betting">
        <div class="chips">
          <button class="chip c5" data-chip="5" aria-label="Add $5">5</button>
          <button class="chip c25" data-chip="25" aria-label="Add $25">25</button>
          <button class="chip c100" data-chip="100" aria-label="Add $100">100</button>
          <button class="chip c500" data-chip="500" aria-label="Add $500">500</button>
        </div>
        <div class="row">
          <button id="clear-bet" class="btn ghost">Clear</button>
          <button id="deal" class="btn primary" disabled>Deal</button>
        </div>
      </div>

      <div class="actions hidden" id="actions">
        <button id="hit" class="btn action">Hit</button>
        <button id="stand" class="btn action">Stand</button>
        <button id="double" class="btn action">Double</button>
      </div>

      <div class="actions hidden" id="next">
        <button id="next-hand" class="btn primary">Next hand</button>
      </div>

      <button id="reset" class="btn link hidden">Out of money? Reset bankroll</button>
    </section>
  </main>

  <footer>
    6-deck shoe · Cards from <a href="https://deckofcardsapi.com" target="_blank" rel="noopener">Deck of Cards API</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
